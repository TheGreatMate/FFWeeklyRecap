services:
  ffweeklyrecap:
    # Build locally or pull from your GitHub Container Registry:
    # image: ghcr.io/dbot97/ffweeklyrecap:latest
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/dbot97/ffweeklyrecap:latest
    container_name: ffweeklyrecap
    restart: unless-stopped
    ports:
      # Host 3085 maps to container 3000 (prevents conflict if ffwarrm uses 3000)
      - "3085:3000"
    volumes:
      # Baked-in Unraid appdata volume path
      - /mnt/user/appdata/ffweeklyrecap:/config
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Optional: Add your Gemini API key for AI-generated commissioner notes
      - GEMINI_API_KEY=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
