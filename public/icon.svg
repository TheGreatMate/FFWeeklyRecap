<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Inner Content Group with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Back Newspaper Sheet (Rotated slightly) -->
    <rect x="135" y="90" width="250" height="310" rx="12" fill="#cbd5e1" transform="rotate(7 260 245)" />

    <!-- Main Front Newspaper Sheet -->
    <rect x="110" y="85" width="270" height="330" rx="16" fill="url(#paperGrad)" stroke="#94a3b8" stroke-width="2" />

    <!-- Newspaper Masthead Banner -->
    <rect x="126" y="105" width="238" height="34" rx="4" fill="#0f172a" />
    <text x="245" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#f8fafc" text-anchor="middle" letter-spacing="3">THE WEEKLY GAZETTE</text>

    <!-- Sub-bar (Volume / Date) -->
    <line x1="126" y1="147" x2="364" y2="147" stroke="#0f172a" stroke-width="2" />
    <line x1="126" y1="151" x2="364" y2="151" stroke="#64748b" stroke-width="1" />

    <!-- Newspaper Headline Blocks -->
    <rect x="126" y="162" width="145" height="10" rx="2" fill="#0f172a" />
    <rect x="126" y="178" width="120" height="8" rx="2" fill="#334155" />
    <rect x="126" y="192" width="135" height="6" rx="2" fill="#64748b" />
    <rect x="126" y="203" width="115" height="6" rx="2" fill="#94a3b8" />
    <rect x="126" y="214" width="130" height="6" rx="2" fill="#94a3b8" />

    <!-- Featured Front Page Image Box (Grid/Chart) -->
    <rect x="282" y="162" width="82" height="62" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="323" cy="183" r="14" fill="#f59e0b" opacity="0.8" />
    <path d="M286 218 L304 200 L320 210 L342 192 L360 218 Z" fill="#0f172a" opacity="0.4" />

    <!-- Two-column Body Article Dividers -->
    <line x1="242" y1="235" x2="242" y2="390" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Column 1 Text Lines -->
    <rect x="126" y="240" width="105" height="6" rx="1.5" fill="#334155" />
    <rect x="126" y="252" width="100" height="5" rx="1" fill="#64748b" />
    <rect x="126" y="262" width="95" height="5" rx="1" fill="#94a3b8" />
    <rect x="126" y="272" width="102" height="5" rx="1" fill="#94a3b8" />
    <rect x="126" y="282" width="98" height="5" rx="1" fill="#94a3b8" />

    <!-- Column 2 Text Lines -->
    <rect x="254" y="240" width="110" height="6" rx="1.5" fill="#334155" />
    <rect x="254" y="252" width="105" height="5" rx="1" fill="#64748b" />
    <rect x="254" y="262" width="98" height="5" rx="1" fill="#94a3b8" />
    <rect x="254" y="272" width="102" height="5" rx="1" fill="#94a3b8" />
    <rect x="254" y="282" width="90" height="5" rx="1" fill="#94a3b8" />
  </g>

  <!-- Stylized Football & Badge Crest Overlapping the Corner -->
  <g filter="url(#dropShadow)">
    <!-- Golden Seal Crest Outer -->
    <circle cx="370" cy="360" r="68" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3" />
    <circle cx="370" cy="360" r="58" fill="#0f172a" />

    <!-- Football Shape -->
    <g transform="translate(370, 360) rotate(-45)">
      <!-- Brown Football Body -->
      <ellipse cx="0" cy="0" rx="42" ry="26" fill="#b45309" stroke="#fef3c7" stroke-width="2.5" />
      <!-- White End Stripes -->
      <path d="M-28 -18 C -24 -6 -24 6 -28 18" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <path d="M28 -18 C 24 -6 24 6 28 18" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <!-- Central Football Laces -->
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="-10" y1="-7" x2="-10" y2="7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <line x1="10" y1="-7" x2="10" y2="7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom App Name Label in Plaque -->
  <rect x="136" y="442" width="240" height="36" rx="18" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="256" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">FF WEEKLY RECAP</text>
</svg>
